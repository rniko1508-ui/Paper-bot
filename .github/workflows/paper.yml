name: paper-bot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Configura git
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"

      - name: Esegui il paper bot (controllo ogni 60 secondi)
        run: python paper_bot.py
        env:
          LOOP_MINUTES: "330"
          LOOP_INTERVAL_SEC: "60"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva stato e storico
        if: success() || failure()
        run: |
          git add state.json trades.csv
          git diff --staged --quiet || (git commit -m "stato paper bot" && git pull --rebase && git push)

      - name: Rilancia il turno successivo
        if: success()
        run: gh workflow run paper.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
